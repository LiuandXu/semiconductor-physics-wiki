site_name: 半导体物理 Wiki
site_url: https://liuandxu.github.io/semiconductor-physics-wiki/
site_description: 半导体物理学（第8版）学习笔记 — 基于刘恩科教材和课程课件整理
site_author: LiuandXu
repo_name: LiuandXu/semiconductor-physics-wiki
repo_url: https://github.com/LiuandXu/semiconductor-physics-wiki
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 LiuandXu | CC BY-SA 4.0

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - toc.follow

extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid.js
  - assets/js/giscus.js

extra_css:
  - assets/css/extra.css

markdown_extensions:
  # Math / LaTeX
  - pymdownx.arithmatex:
      generic: true
  # Code & formatting
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.inlinehilite
  # Admonitions & callouts
  - admonition
  - pymdownx.details
  # Tables & lists
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  # Typography
  - pymdownx.smartsymbols
  - pymdownx.magiclink
  # Task lists
  - pymdownx.tasklist:
      custom_checkbox: true
  # Emoji
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # TOC
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - zh
        - en

